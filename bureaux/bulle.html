<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- color-scheme « dark » : identique a la page WorkAdventure, sinon le navigateur peint un fond blanc opaque sous la page -->
<meta name="color-scheme" content="dark">
<title>Bulle de la mascotte · Campus M@N</title>
<!-- Bulle de dialogue du PNJ mascotte (campus anime ; reprise de la maquette v3, dialogues « campus » ajoutes). Declaree dans la carte comme objet « site web » (bulle_mascotte), affichee par le script de la carte.
     Dialogue choisi par ?dialogue=accueil. Les textes ci-dessous sont des EXEMPLES a remplacer.
     Test hors WorkAdventure : ouvrir bulle.html?dialogue=accueil dans un navigateur. -->
<script src="https://play.workadventu.re/iframe_api.js"></script>
<style>
@font-face{font-family:'Gordita';src:url(supports/fonts/Gordita-Regular.otf) format('opentype');font-weight:400}
@font-face{font-family:'Gordita';src:url(supports/fonts/Gordita-Bold.otf) format('opentype');font-weight:700}
:root{color-scheme:dark;--jaune:#FDD12F;--orange:#F39200;--encre:#2E2E2E;--bord:#3A3A3A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{font-family:Gordita,system-ui,sans-serif;color:var(--encre);padding:14px 6px 6px 18px}
.bulle{position:relative;height:100%;background:#fff;border:3px solid var(--bord);border-radius:18px;padding:16px 14px 10px;
  box-shadow:4px 5px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;transform-origin:0 45%;animation:pop .28s cubic-bezier(.2,1.4,.5,1)}
.bulle.fin{animation:sortie .35s ease-in forwards}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sortie{to{transform:scale(.6);opacity:0}}
/* pointe vers la tete de la mascotte (a gauche) */
.bulle::before,.bulle::after{content:"";position:absolute;top:44px;border-style:solid}
.bulle::before{left:-19px;border-width:10px 18px 10px 0;border-color:transparent var(--bord) transparent transparent}
.bulle::after{left:-13px;top:47px;border-width:7px 13px 7px 0;border-color:transparent #fff transparent transparent}
.nom{position:absolute;top:-13px;left:14px;background:var(--jaune);border:2px solid var(--bord);border-radius:999px;font-size:11px;font-weight:700;padding:2px 10px}
.texte{flex:1;font-size:13.5px;line-height:1.45;cursor:pointer;overflow:hidden}
.texte .curseur{display:inline-block;width:7px;height:13px;background:var(--orange);margin-left:2px;vertical-align:-1px;animation:clign .8s steps(1) infinite}
@keyframes clign{50%{opacity:0}}
.actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;min-height:26px}
button{font:inherit;font-size:12px;font-weight:700;border:2px solid var(--bord);border-radius:999px;padding:4px 11px;cursor:pointer;background:#fff;color:var(--encre)}
button.suivant{background:var(--orange);color:#fff;border-color:#C77500}
button.choix{background:#FFF4C2}
button:hover{transform:translateY(-1px)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:1px}
.points{display:flex;gap:4px;align-items:center;margin-right:auto}
.points i{width:6px;height:6px;border-radius:50%;background:#D9D9D9}
.points i.on{background:var(--orange)}
/* variante « pointe en bas » (?pointe=bas) : bulle au-dessus de la mascotte, pointe vers le bas a gauche */
body.bas{padding:12px 6px 20px 6px}
body.court .actions{display:none}
body.court .bulle{padding:14px 12px 10px}
body.bas .bulle{padding:14px 12px 8px}
body.bas .texte{font-size:13px;line-height:1.4}
body.bas button{padding:3px 10px}
body.bas .bulle{transform-origin:12% 100%}
body.bas .bulle::before{top:auto;bottom:-19px;left:22px;border-width:18px 10px 0 10px;border-color:var(--bord) transparent transparent transparent}
body.bas .bulle::after{top:auto;bottom:-12px;left:25px;border-width:13px 7px 0 7px;border-color:#fff transparent transparent transparent}
@media (prefers-reduced-motion:reduce){.bulle,.bulle.fin,.texte .curseur{animation:none}}
</style>
</head>
<body>
<div class="bulle" id="bulle">
  <span class="nom">Mascotte M@N</span>
  <div class="texte" id="texte" aria-live="polite"></div>
  <div class="actions" id="actions"></div>
</div>
<script>
// Dialogues : une suite de repliques, puis soit des choix, soit la suite (« ensuite »), soit la fin.
var DIALOGUES = {
  bureau: { repliques: ["Bienvenue dans le Bureau virtuel M@N !"], fin: true },
  campus: { repliques: ["Bienvenue au Campus M@N ! Je suis la mascotte de Mon Assistant Numérique.",
                        "Les bornes @ orange vous emmènent directement devant chaque bâtiment."],
            choix: [["Où puis-je entrer ?", "campus_ouverts"], ["Comment on se déplace ?", "aide"], ["Merci !", "fin"]] },
  campus_ouverts: { repliques: ["Pour l'instant, le Bureau virtuel et l'Espace Candidat sont ouverts : repérez les cercles orange qui pulsent devant leurs portes.",
                                "Les autres bâtiments ouvriront bientôt !"],
                    choix: [["Comment on se déplace ?", "aide"], ["Merci !", "fin"]] },
  accueil: { repliques: ["Bonjour et bienvenue sur le Campus M@N ! Je suis la mascotte de Mon Assistant Numérique.",
                         "Je suis là pour vous guider. Que voulez-vous savoir ?"],
             choix: [["C'est quoi l'Espace Candidat ?", "candidat"], ["Comment on se déplace ?", "aide"], ["Rien, merci !", "fin"]] },
  candidat: { repliques: ["L'Espace Candidat présente le parcours pour devenir franchisé M@N, étape par étape.",
                          "Dans chaque salle, approchez-vous des pastilles orange : elles ouvrent le support de l'étape."],
              choix: [["Et pour se déplacer ?", "aide"], ["Merci, c'est clair !", "fin"]] },
  aide: { repliques: ["Utilisez les flèches du clavier pour vous déplacer, ou cliquez à l'endroit où vous voulez aller.",
                      "Les objets qui brillent ont souvent quelque chose à vous dire !"],
          choix: [["C'est quoi l'Espace Candidat ?", "candidat"], ["Merci !", "fin"]] },
  fin: { repliques: ["Avec plaisir ! À bientôt sur le Campus M@N."], fin: true }
};
var VITESSE = 28;                       // ms par lettre
var texte = document.getElementById('texte'), actions = document.getElementById('actions'), bulle = document.getElementById('bulle');
var courant, idx, timer = null, complet = false;
var api = false;

function bouton(label, cls, fn) { var b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = label; b.addEventListener('click', fn); actions.appendChild(b); return b; }
function points() {
  var p = document.createElement('span'); p.className = 'points';
  courant.repliques.forEach(function (_, i) { var d = document.createElement('i'); if (i === idx) d.className = 'on'; p.appendChild(d); });
  if (courant.repliques.length > 1) actions.appendChild(p);
}
function taper(phrase) {
  clearInterval(timer); complet = false; actions.replaceChildren();
  var n = 0; texte.textContent = '';
  var c = document.createElement('span'); c.className = 'curseur';
  var t = document.createTextNode(''); texte.append(t, c);
  timer = setInterval(function () {
    n++; t.nodeValue = phrase.slice(0, n);
    if (n >= phrase.length) terminer(phrase);
  }, VITESSE);
}
function terminer(phrase) {
  clearInterval(timer); complet = true; texte.textContent = phrase; actions.replaceChildren(); points();
  var dernier = idx === courant.repliques.length - 1;
  if (!dernier) { bouton('Suivant ▸', 'suivant', function () { idx++; taper(courant.repliques[idx]); }).focus(); return; }
  if (courant.choix) { courant.choix.forEach(function (c) { bouton(c[0], 'choix', function () { lancer(c[1]); }); }); return; }
  if (courant.fin) { setTimeout(fermer, 2200); if (Q.get('court') !== '1') bouton('Fermer', 'suivant', fermer); }
}
function lancer(nom) { courant = DIALOGUES[nom] || DIALOGUES.accueil; idx = 0; taper(courant.repliques[0]); }
texte.addEventListener('click', function () { if (!complet) terminer(courant.repliques[idx]); });   // clic = afficher tout de suite
function fermer() {
  bulle.classList.add('fin');
  setTimeout(function () {
    if (api) { WA.room.showLayer('pnj_indicateur'); WA.room.website.get(Q.get('dialogue') === 'bureau' ? 'bulle_accueil' : 'bulle_mascotte').then(function (w) { w.visible = false; }).catch(function () {}); }
  }, 360);
}
if (window.WA) { WA.onInit().then(function () { api = true; }).catch(function () {}); }
var Q = new URLSearchParams(location.search);
if (Q.get('pointe') === 'bas') document.body.classList.add('bas');
if (Q.get('court') === '1') document.body.classList.add('court');
lancer(Q.get('dialogue') || 'accueil');
</script>
</body>
</html>
